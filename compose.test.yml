services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: paybridge_http_test
      POSTGRES_USER: paybridge
      POSTGRES_PASSWORD: paybridge-test-only
    ports: ["127.0.0.1:15433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paybridge -d paybridge_http_test"]
      interval: 2s
      retries: 15
